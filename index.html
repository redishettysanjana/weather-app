<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="weather-app">
        <h1>Weather App</h1>
        <p>Explore weather worldwide — search cities, countries, continents, and remote places</p>

        <form id="weather-form">
            <div class="city-search-wrapper">
                <input
                    type="text"
                    id="city-input"
                    placeholder="Search a city, country, continent, or place..."
                    aria-label="Search for a location"
                    autocomplete="off"
                    required
                >

                <div id="city-suggestions" class="city-suggestions"></div>
            </div>

            <button type="submit">Search</button>
        </form>

        <p id="message" role="status"></p>

        <section id="weather-result"></section>
    </main>
</body>

</html>
